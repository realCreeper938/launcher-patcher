name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PCL_CE_URL: https://github.com/PCL-Community/PCL-CE/releases/download/v2.15.1/PCL2_CE_Release_x64.exe
  HMCL_JAR_URL: https://github.com/HMCL-dev/HMCL/releases/download/v3.17.0.362/HMCL-3.17.0.362.jar
  HMCL_EXE_URL: https://github.com/HMCL-dev/HMCL/releases/download/v3.17.0.362/HMCL-3.17.0.362.exe

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./... -count=1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download pinned launcher samples
        run: |
          mkdir -p "$RUNNER_TEMP/samples"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/samples/PCL2_CE_Release_x64.exe" "$PCL_CE_URL"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/samples/HMCL.jar" "$HMCL_JAR_URL"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/samples/HMCL.exe" "$HMCL_EXE_URL"
      - name: Patch real launchers
        env:
          PCL_CE_SAMPLE: ${{ runner.temp }}/samples/PCL2_CE_Release_x64.exe
          HMCL_JAR_SAMPLE: ${{ runner.temp }}/samples/HMCL.jar
          HMCL_EXE_SAMPLE: ${{ runner.temp }}/samples/HMCL.exe
        run: go test ./internal/patcher -run '^TestReal' -v -count=1

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download pinned launcher samples
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "samples"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri $env:PCL_CE_URL -OutFile (Join-Path $dir "PCL2_CE_Release_x64.exe")
          Invoke-WebRequest -Uri $env:HMCL_JAR_URL -OutFile (Join-Path $dir "HMCL-3.17.0.362.jar")
          Invoke-WebRequest -Uri $env:HMCL_EXE_URL -OutFile (Join-Path $dir "HMCL-3.17.0.362.exe")
      - name: Build and patch on Windows
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" -o dist/launcher-patcher.exe .
          $samples = Join-Path $env:RUNNER_TEMP "samples"
          $exe = (Resolve-Path "dist/launcher-patcher.exe").Path
          foreach ($name in @("PCL2_CE_Release_x64.exe", "HMCL-3.17.0.362.jar", "HMCL-3.17.0.362.exe")) {
            $input = Join-Path $samples $name
            $proc = Start-Process -FilePath $exe -ArgumentList "`"$input`"" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "patch failed for $name (exit $($proc.ExitCode))" }
            $base = [IO.Path]::GetFileNameWithoutExtension($name)
            $expected = Join-Path $samples ($base + "_patched" + [IO.Path]::GetExtension($name))
            if (-not (Test-Path $expected)) { throw "missing output $expected" }
          }
          $log = Join-Path $env:LOCALAPPDATA "launcher-patcher\last.log"
          if (-not (Test-Path $log)) { throw "log file was not created" }
          if (-not (Select-String -Path $log -Pattern "\[完成\]" -Quiet)) { throw "log has no success entry" }
          Get-Item (Join-Path $samples "*_patched.*") | Select-Object Name, Length
          Get-Content $log

  build:
    needs: [unit, e2e, windows-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build windows/${{ matrix.arch }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" \
            -o "dist/launcher-patcher-windows-${{ matrix.arch }}.exe" .
          file "dist/launcher-patcher-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-patcher-windows-${{ matrix.arch }}
          path: dist/launcher-patcher-windows-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS \
              --title "launcher-patcher $GITHUB_REF_NAME" --generate-notes
          fi
